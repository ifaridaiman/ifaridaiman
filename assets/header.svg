<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title">
  <title id="title">Farid Aiman. Software Engineer, Next.js and Go. Document and storage systems.</title>
  <style>
    .bg{fill:#ffffff;stroke:#e4e4e7}
    .ink{fill:#18181b}
    .mute{fill:#71717a}
    .faint{fill:#e4e4e7}
    .paper{fill:#ffffff;stroke:#d4d4d8}
    .chip{fill:#fafafa;stroke:#e4e4e7}
    .acc{fill:#059669}
    .band{stop-color:#059669}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0d1117;stroke:#27272a}
      .ink{fill:#fafafa}
      .mute{fill:#a1a1aa}
      .faint{fill:#27272a}
      .paper{fill:#161b22;stroke:#3f3f46}
      .chip{fill:#161b22;stroke:#30363d}
      .acc{fill:#34d399}
      .band{stop-color:#34d399}
    }
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    .scan{animation:scan 3.6s cubic-bezier(.16,1,.3,1) infinite}
    @keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:1}80%{opacity:1}100%{transform:translateY(176px);opacity:0}}
    .float{animation:float 4s ease-in-out infinite}
    .d1{animation-delay:-1.3s}
    .d2{animation-delay:-2.6s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  </style>
  <defs>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop class="band" offset="0" stop-opacity=".35"/>
      <stop class="band" offset="1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="page"><rect x="900" y="72" width="170" height="210" rx="10"/></clipPath>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1199" height="319" rx="24"/>

  <!-- left: identity -->
  <circle class="acc pulse" cx="70" cy="91" r="5"/>
  <text class="mono mute" x="86" y="96" font-size="14" letter-spacing="2">SOFTWARE ENGINEER · 6+ YEARS</text>
  <text class="sans ink" x="62" y="170" font-size="64" font-weight="600" letter-spacing="-2">Farid Aiman</text>
  <text class="sans mute" x="64" y="214" font-size="22">Next.js and Go. Document and storage systems.</text>
  <text class="mono mute" x="64" y="262" font-size="13" letter-spacing="1">feature slicing  /  hybrid DDD  /  lean delivery</text>

  <!-- right: processing chips -->
  <g class="float">
    <rect class="chip" x="700" y="96" width="170" height="32" rx="16"/>
    <circle class="acc" cx="718" cy="112" r="3.5"/>
    <text class="mono ink" x="730" y="117" font-size="13">compress</text>
    <text class="mono mute" x="806" y="117" font-size="13">-61.4%</text>
  </g>
  <g class="float d1">
    <rect class="chip" x="680" y="146" width="190" height="32" rx="16"/>
    <circle class="acc" cx="698" cy="162" r="3.5"/>
    <text class="mono ink" x="710" y="167" font-size="13">ocr</text>
    <text class="mono mute" x="748" y="167" font-size="13">1,284 words</text>
  </g>
  <g class="float d2">
    <rect class="chip" x="710" y="196" width="160" height="32" rx="16"/>
    <circle class="acc" cx="728" cy="212" r="3.5"/>
    <text class="mono ink" x="740" y="217" font-size="13">meta</text>
    <text class="mono mute" x="786" y="217" font-size="13">17 fields</text>
  </g>

  <!-- right: document stack -->
  <rect class="paper" x="960" y="40" width="170" height="210" rx="10"/>
  <rect class="paper" x="930" y="56" width="170" height="210" rx="10"/>
  <rect class="paper" x="900" y="72" width="170" height="210" rx="10"/>
  <rect class="acc" x="920" y="96" width="64" height="9" rx="3"/>
  <g class="faint">
    <rect x="920" y="124" width="130" height="6" rx="3"/>
    <rect x="920" y="142" width="112" height="6" rx="3"/>
    <rect x="920" y="160" width="124" height="6" rx="3"/>
    <rect x="920" y="178" width="96" height="6" rx="3"/>
    <rect x="920" y="196" width="130" height="6" rx="3"/>
    <rect x="920" y="214" width="104" height="6" rx="3"/>
    <rect x="920" y="232" width="118" height="6" rx="3"/>
    <rect x="920" y="250" width="70" height="6" rx="3"/>
  </g>
  <g clip-path="url(#page)">
    <g class="scan">
      <rect x="900" y="52" width="170" height="40" fill="url(#beam)"/>
      <rect class="acc" x="900" y="91" width="170" height="2"/>
    </g>
  </g>
</svg>
