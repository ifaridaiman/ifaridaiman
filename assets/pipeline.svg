<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-labelledby="title">
  <title id="title">Document pipeline built in Go with ent: input, compress, OCR, metadata, store.</title>
  <style>
    .ink{fill:#18181b}
    .mute{fill:#71717a}
    .wire{stroke:#d4d4d8}
    .paper{fill:#ffffff;stroke:#d4d4d8}
    .acc{fill:#059669}
    .ring{fill:none;stroke:#059669}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @media (prefers-color-scheme:dark){
      .ink{fill:#fafafa}
      .mute{fill:#a1a1aa}
      .wire{stroke:#3f3f46}
      .paper{fill:#161b22;stroke:#30363d}
      .acc{fill:#34d399}
      .ring{stroke:#34d399}
    }
    .travel{animation:travel 6s linear infinite}
    @keyframes travel{from{transform:translateX(0)}to{transform:translateX(960px)}}
    .hit{opacity:0;animation:hit 6s ease-out infinite}
    @keyframes hit{0%{opacity:1}12%{opacity:0}100%{opacity:0}}
    .n1{animation-delay:1.5s}
    .n2{animation-delay:3s}
    .n3{animation-delay:4.5s}
    .n4{animation-delay:6s}
  </style>

  <text class="mono mute" x="30" y="28" font-size="12" letter-spacing="2">PIPELINE  /  GO + ENT</text>

  <!-- wires -->
  <g class="wire" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="210" y1="96" x2="270" y2="96"/>
    <line x1="450" y1="96" x2="510" y2="96"/>
    <line x1="690" y1="96" x2="750" y2="96"/>
    <line x1="930" y1="96" x2="990" y2="96"/>
  </g>

  <!-- packet travels under the nodes, visible in the gaps -->
  <circle class="acc travel" cx="120" cy="96" r="4.5"/>

  <!-- nodes -->
  <g>
    <rect class="paper" x="30" y="64" width="180" height="64" rx="14"/>
    <text class="mono ink" x="120" y="92" font-size="15" text-anchor="middle">input</text>
    <text class="sans mute" x="120" y="112" font-size="12" text-anchor="middle">pdf · tiff · jpg</text>
  </g>
  <g>
    <rect class="paper" x="270" y="64" width="180" height="64" rx="14"/>
    <text class="mono ink" x="360" y="92" font-size="15" text-anchor="middle">compress</text>
    <text class="sans mute" x="360" y="112" font-size="12" text-anchor="middle">smaller, still readable</text>
  </g>
  <g>
    <rect class="paper" x="510" y="64" width="180" height="64" rx="14"/>
    <text class="mono ink" x="600" y="92" font-size="15" text-anchor="middle">ocr</text>
    <text class="sans mute" x="600" y="112" font-size="12" text-anchor="middle">searchable text</text>
  </g>
  <g>
    <rect class="paper" x="750" y="64" width="180" height="64" rx="14"/>
    <text class="mono ink" x="840" y="92" font-size="15" text-anchor="middle">metadata</text>
    <text class="sans mute" x="840" y="112" font-size="12" text-anchor="middle">extract · render</text>
  </g>
  <g>
    <rect class="paper" x="990" y="64" width="180" height="64" rx="14"/>
    <text class="mono ink" x="1080" y="92" font-size="15" text-anchor="middle">store</text>
    <text class="sans mute" x="1080" y="112" font-size="12" text-anchor="middle">ent schema</text>
  </g>

  <!-- arrival flashes -->
  <rect class="ring hit" x="30" y="64" width="180" height="64" rx="14" stroke-width="1.5"/>
  <rect class="ring hit n1" x="270" y="64" width="180" height="64" rx="14" stroke-width="1.5"/>
  <rect class="ring hit n2" x="510" y="64" width="180" height="64" rx="14" stroke-width="1.5"/>
  <rect class="ring hit n3" x="750" y="64" width="180" height="64" rx="14" stroke-width="1.5"/>
  <rect class="ring hit n4" x="990" y="64" width="180" height="64" rx="14" stroke-width="1.5"/>
</svg>
